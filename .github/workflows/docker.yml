name: Docker Hub

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.repository }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'timorm/fast-note-sync-service' }}

jobs:
  docker:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Read Go application version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from datetime import datetime, timezone
          from pathlib import Path
          source = Path('internal/app/version.go').read_text()
          match = re.search(r'\bVersion\s+string\s*=\s*"([^"]+)"', source)
          version = match.group(1) if match else ''
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Go Version must be a Docker-compatible semantic version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'build_date={datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}\n')
          PY
      - name: Validate Docker Hub configuration
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets.' >&2
            exit 1
          fi
          if [[ ! "$IMAGE_NAME" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo 'DOCKERHUB_IMAGE must be namespace/repository, without registry or tag.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build local image for integration checks
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: fast-note-sync-service:local
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            GIT_COMMIT=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=fns-docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fns-docker-${{ matrix.arch }}
          provenance: false
      - name: Check single-container integration and recovery
        working-directory: web
        run: npm run smoke:docker
      # All build layers already exist locally. This exports them by digest,
      # without recompilation or publishing a version tag before both jobs pass.
      - name: Export tested image layers to Docker Hub
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            GIT_COMMIT=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
      - name: Record image digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish version and latest manifests
        env:
          VERSION: ${{ needs.docker.outputs.version }}
        shell: bash
        run: |
          IMAGE="$REGISTRY/$IMAGE_NAME"
          references=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            references+=("$IMAGE@sha256:$(basename "$digest")")
          done
          test "${#references[@]}" -eq 2
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "${references[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION" | tee "$RUNNER_TEMP/manifest.txt"
          grep -q 'linux/amd64' "$RUNNER_TEMP/manifest.txt"
          grep -q 'linux/arm64' "$RUNNER_TEMP/manifest.txt"
          {
            echo '### Docker Hub image'
            echo "- Image: $IMAGE:$VERSION"
            echo "- Source: $GITHUB_SHA"
            echo '- Platforms: linux/amd64, linux/arm64 (parallel build and integration checks)'
            echo "- Alias: $IMAGE:latest"
            echo '```'
            cat "$RUNNER_TEMP/manifest.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
